            content: "";

            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 12s linear infinite;

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }

        /* floating glitch orbs */
        .glow-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 30% 30%, rgba(20, 180, 230, 0.15), transparent 70%);

        .orb2 { bottom: -150px; right: -50px; width: 400px; height: 400px; background: radial-gradient(circle, #aa00ff15, #ff006615); animation-duration: 25s; }

        /* ROG header with glitch */

        /* double button row — slick */
        .action-grid {
            display: flex;

            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .cyber-btn {
            flex: 1 1 180px;
            background: rgba(8, 25, 40, 0.7);

        /* bottom glitch note */

    <script>
        (function() {

            // ---------- CORE TOTP ----------
            function base32Decode(base32) {
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
                base32 = base32.replace(/\s+/g, '').replace(/=+$/, '').toUpperCase();
                let bits = 0, value = 0, output = [];
                for (let i = 0; i < base32.length; i++) {
                    const char = base32[i];
                    const index = alphabet.indexOf(char);
                    if (index === -1) throw new Error('Invalid Base32');
                    value = (value << 5) | index;
                    bits += 5;
                    if (bits >= 8) {
                        output.push((value >>> (bits - 8)) & 0xFF);
                        bits -= 8;
                    }
                }
                return new Uint8Array(output);
            }

            function generateTOTP(secret) {
                const key = base32Decode(secret);
                const keyWA = CryptoJS.lib.WordArray.create(key);
                const timeStep = 30;
                const counter = Math.floor(Date.now() / 1000 / timeStep);
                const counterBytes = new ArrayBuffer(8);
                const counterView = new DataView(counterBytes);
                counterView.setUint32(4, counter, false); // big-endian
                const counterWA = CryptoJS.lib.WordArray.create(new Uint8Array(counterBytes));
                const hmac = CryptoJS.HmacSHA1(counterWA, keyWA);
                const hmacHex = hmac.toString(CryptoJS.enc.Hex);
                const offset = parseInt(hmacHex.substr(39, 1), 16) * 2;
                const otpHex = hmacHex.substr(offset, 8);
                let otp = parseInt(otpHex, 16) & 0x7FFFFFFF;
                otp = otp % 1000000;
                return otp.toString().padStart(6, '0');
            }

            // ------- DOM refs -------
            const inputField = document.getElementById('twofa');
            const totpCodeSpan = document.getElementById('totpCode');
            const timerFill = document.getElementById('timerFill');
            const timerSecondsSpan = document.getElementById('timerSeconds');

            let currentSecret = '';

            // update UI with latest OTP (and copy to clipboard)
            function updateDisplayAndCopy(secret) {
                if (!secret || secret.length < 16) {
                    totpCodeSpan.innerText = '------';
                    return;
                }
                try {
                    const code = generateTOTP(secret);
                    totpCodeSpan.innerText = code;
                    otpCache = code;
                    // auto copy to clipboard
                    navigator.clipboard.writeText(code).catch(() => {
                        // fallback
                        const el = document.createElement('textarea');
                        el.value = code;
                        document.body.appendChild(el);
                        el.select();
                        document.execCommand('copy');
                        document.body.removeChild(el);
                    });
                } catch (e) {
                    totpCodeSpan.innerText = 'ERROR';
                    console.warn('TOTP error', e);
                }
            }

            // timer update (every second)
            function updateTimerAndOtp() {
                const nowSec = Math.floor(Date.now() / 1000);
                const step = 30;
                const counter = Math.floor(nowSec / step);
                const remaining = step - (nowSec % step);
                const percent = (remaining / step) * 100;
                timerFill.style.width = percent + '%';
                timerSecondsSpan.innerText = remaining + 's';

                //もし残り時間が29秒だったら再生成 (または新しい周期の最初)
                // we generate at 30 and 0 to be safe, but best: when remaining === 30 or 29, we regenerate
                if (currentSecret && currentSecret.length >= 16) {
                    if (remaining === 30 || remaining === 29) {
                        // slight delay to avoid double generation
                        updateDisplayAndCopy(currentSecret);
                    } else if (remaining === 1) {
                        // also right before expiry (to be smooth)
                        updateDisplayAndCopy(currentSecret);
                    }
                } else {
                    totpCodeSpan.innerText = '------';
                }
            }

            function startTimer() {
                stopTimer();
                // initial update
                if (currentSecret && currentSecret.length >= 16) {
                    updateDisplayAndCopy(currentSecret);
                }
                timerInterval = setInterval(() => {
                    updateTimerAndOtp();
                }, 200); // smooth timer bar
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            // when secret changes (manual or paste)
            function onSecretInput() {
                const raw = inputField.value.trim();
                if (raw.length >= 16) {
                    currentSecret = raw;
                    updateDisplayAndCopy(currentSecret);
                    startTimer(); // ensures timer runs
                } else {
                    currentSecret = '';
                    totpCodeSpan.innerText = '------';
                    stopTimer();
                    // reset timer visuals
                    timerFill.style.width = '100%';
                    timerSecondsSpan.innerText = '30s';
                }
            }

            // clear all

                inputField.value = '';
                currentSecret = '';
                totpCodeSpan.innerText = '------';
                stopTimer();
                timerFill.style.width = '100%';
                timerSecondsSpan.innerText = '30s';
            }
