    <!-- ✅ শুধু লোডিং ফিক্স - CryptoJS প্রিলোড ও ফলব্যাক -->
    <script>
        (function() {
            // CryptoJS লোড ফাংশন - মাল্টিপল CDN
            function loadCryptoJS() {
                // প্রথম CDN
                var script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js';
                
                script.onerror = function() {
                    // প্রথম CDN ফেল হলে দ্বিতীয় CDN
                    var backupScript = document.createElement('script');
                    backupScript.src = 'https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js';
                    document.head.appendChild(backupScript);
                };
                
                document.head.appendChild(script);
            }
            
            // এখনই লোড করা শুরু করুন
            loadCryptoJS();
        })();
    </script>
